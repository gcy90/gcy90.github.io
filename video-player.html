<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频播放 - 创意机器人</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    .btn-back {
      @apply bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-all flex items-center;
    }
    .video-container {
      @apply aspect-video w-full bg-black rounded-lg overflow-visible; /* 确保控件不被遮挡 */
    }
    video {
      overflow: visible !important; /* 强制显示播放控件 */
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- 头部：返回按钮 -->
  <header class="bg-white shadow-sm py-4 sticky top-0 z-10">
    <div class="container mx-auto px-4">
      <a href="index.html" class="btn-back">
        <i class="fa fa-arrow-left mr-2"></i>
        <span class="font-bold">返回课程列表</span>
      </a>
    </div>
  </header>

  <!-- 主要内容 -->
  <main class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm p-6 md:p-8">
      <!-- 视频播放区（线上环境适配） -->
      <div class="video-container mb-6">
        <video 
          src="/videos/a1.mp4"  <!-- 线上兼容路径：根目录相对路径 -->
          class="w-full h-full object-contain"
          controls
          preload="metadata"  <!-- 优化线上加载速度 -->
          playsinline
          webkit-playsinline  <!-- 兼容iOS -->
          x5-video-player-type="h5"  <!-- 兼容安卓微信浏览器 -->
          muted
        >
          <!-- 多格式备选，提升兼容性 -->
          <source src="/videos/a1.mp4" type="video/mp4">
          <source src="/videos/a1.webm" type="video/webm">
          您的浏览器不支持HTML5视频播放，请更新浏览器至最新版本。
        </video>
      </div>

      <!-- 手动播放按钮（应对线上浏览器限制） -->
      <div class="text-center mb-6">
        <button onclick="document.querySelector('video').play()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all">
          <i class="fa fa-play mr-1"></i> 点击播放视频
        </button>
      </div>

      <!-- 视频信息 -->
      <div class="mb-6">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-3">大颗粒结构搭建</h1>
        <div class="flex flex-wrap items-center text-gray-500 text-sm gap-4">
          <span><i class="fa fa-user mr-1"></i> 郭老师</span>
          <span><i class="fa fa-clock-o mr-1"></i> 15:30</span>
          <span><i class="fa fa-eye mr-1"></i> 1.2k 次观看</span>
        </div>
      </div>

      <!-- 课程简介 -->
      <div class="border-t border-gray-200 pt-6">
        <h3 class="text-lg font-bold text-gray-800 mb-3">课程简介</h3>
        <p class="text-gray-600 leading-relaxed">
          学习搭建稳定性结构（互锁结构、递增结构等），锻炼动手能力、问题解决能力、抗挫能力及专注力等。
        </p>
      </div>
    </div>
  </main>

  <!-- 线上环境播放优化脚本 -->
  <script>
    // 1. 页面加载后初始化视频
    window.addEventListener('load', function() {
      const video = document.querySelector('video');
      // 预加载视频元数据（时长、尺寸等）
      video.load();
      
      // 2. 监听视频错误（线上环境调试用）
      video.addEventListener('error', function() {
        console.log('视频加载错误：');
        switch(video.error.code) {
          case 1: alert('视频文件未找到，请检查/videos/a1.mp4是否存在'); break;
          case 2: alert('视频格式不支持，请确认是H.264编码的MP4'); break;
          case 4: alert('视频文件损坏，请重新上传'); break;
        }
      });
    });
  </script>
</body>
</html>
