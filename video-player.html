<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频播放 - 创意机器人</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    .btn-primary {
      @apply bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition-all;
    }
  </style>
</head>
<body class="bg-gray-100 font-inter">
  <header class="bg-white shadow-sm py-4">
    <div class="container mx-auto px-4">
      <a href="index.html" class="flex items-center text-primary">
        <i class="fa fa-arrow-left mr-2 text-xl"></i>
        <span class="text-lg font-bold">返回课程列表</span>
      </a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm p-6">
      <!-- 视频播放区域 -->
      <div class="aspect-video w-full bg-black rounded-lg overflow-hidden mb-6">
        <!-- 替换为你的视频地址（支持本地视频/在线视频链接） -->
        <video 
          src="/videos/a1.mp4"    ! -- 示例:本地视频放项目根目录,直接写文件名;在线视频写完整URL -->
          class="w-full h-full object-contain"
          controls
          preload="metadata"
        >
          您的浏览器不支持视频播放，请更新浏览器。
        </video>
      </div>

      <!-- 视频信息 -->
      <h1 class="text-2xl font-bold mb-2" id="video-title">大颗粒结构搭建</h1>
      <div class="flex items-center text-gray-500 mb-6">
        <span class="mr-4"><i class="fa fa-user mr-1"></i> 郭老师</span>
        <span class="mr-4"><i class="fa fa-clock-o mr-1"></i> 15:30</span>
        <span><i class="fa fa-eye mr-1"></i> 1.2k 次观看</span>
      </div>

      <!-- 视频简介 -->
      <div class="border-t pt-4">
        <h3 class="font-bold mb-2">课程简介</h3>
        <p class="text-gray-600">学习搭建稳定性结构（互锁结构、递增结构等），锻炼动手能力，解决问题能力，抗挫能力及专注力等</p>
      </div>
    </div>
  </main>
</body>
</html>
