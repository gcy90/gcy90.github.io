<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频播放 - 创意机器人</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    .btn-back { @apply bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition-all flex items-center; }
    .video-container { @apply aspect-video w-full bg-black rounded-lg overflow-hidden; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- 头部：返回按钮 -->
  <header class="bg-white shadow-sm py-4 sticky top-0 z-10">
    <div class="container mx-auto px-4">
      <a href="index.html" class="btn-back">
        <i class="fa fa-arrow-left mr-2"></i>
        <span>返回课程列表</span>
      </a>
    </div>
  </header>

  <!-- 主要内容：视频播放区 -->
  <main class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm p-6 md:p-8">
      <!-- 视频播放核心区域（已修复路径） -->
      <div class="video-container mb-6">
        <video 
          src="videos/a1.mp4"  <!-- 兼容本地和GitHub Pages的路径 -->
          class="w-full h-full object-contain"
          controls
          preload="auto"
        >
          您的浏览器不支持视频播放，请更新浏览器
        </video>
      </div>

      <!-- 视频信息 -->
      <div>
        <h1 class="text-2xl font-bold mb-3">大颗粒结构搭建</h1>
        <div class="flex items-center text-gray-500 text-sm">
          <span><i class="fa fa-user mr-1"></i> 郭老师</span>
          <span class="mx-3">•</span>
          <span><i class="fa fa-clock-o mr-1"></i> 15:30</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
